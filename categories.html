<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品分類 | Cat Gaze - 探索植感美學</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-main: #7F916A;
            --text-dark: #333;
            --overlay: rgba(0, 0, 0, 0.4);
            --price-color: #d14900;
        }
        body { font-family: 'Noto Sans TC', sans-serif; margin: 0; background: #fcfcf8; }
        .container { width: 90%; max-width: 1200px; margin: 0 auto; }
        
        /* --- 全站統一 Header 導覽列 --- */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #eeeeee;
            padding: 0.8rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 55px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 10px;
        }
        .logo-img, .site-logo {
            height: 42px;
            width: auto;
            border-radius: 50%;
            margin-right: 4px;
        }
        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #7F916A;
            letter-spacing: 1px;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            white-space: nowrap;
            margin: 0;
        }
        .nav-links a:hover, .nav-links a.active-nav {
            color: #7F916A;
            font-weight: 700;
        }
        #cart-count {
            background: #d14900;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            position: absolute;
            top: -10px;
            right: -15px;
            font-weight: bold;
            line-height: 1.2;
        }
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                height: auto;
                padding: 10px 0;
                gap: 12px;
            }
            .nav-links {
                justify-content: center;
                gap: 12px;
                width: 100%;
            }
            .nav-links a {
                font-size: 0.88rem;
            }
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 4rem 0;
        }
        .category-card {
            position: relative;
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.5s ease;
        }
        .cat-conifer { background: url('https://images.unsplash.com/photo-1512428813834-c702c7702b78?auto=format&fit=crop&w=1000&q=80') center/cover; }
        .cat-deciduous { background: url('https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=1000&q=80') center/cover; }
        .cat-mini { background: url('https://images.unsplash.com/photo-1463320898484-cdee8141c787?auto=format&fit=crop&w=1000&q=80') center/cover; }
        .cat-pots { background: url('https://images.unsplash.com/photo-1485955900006-10f4d324d411?auto=format&fit=crop&w=1000&q=80') center/cover; }
        .category-card::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay); transition: 0.4s;
        }
        .category-card:hover::before { background: rgba(127, 145, 106, 0.7); }
        .category-content { position: relative; z-index: 1; text-align: center; color: white; }
        .category-content h2 { font-size: 2.2rem; margin-bottom: 5px; letter-spacing: 4px; font-weight: 500; }
        .category-content p { font-size: 0.9rem; opacity: 0.9; letter-spacing: 2px; text-transform: uppercase; }
        footer { background-color: var(--brand-main); color: white; text-align: center; padding: 3rem 0; margin-top: 2rem; }
        @media (max-width: 768px) {
            .category-grid { grid-template-columns: 1fr; }
            .category-card { height: 250px; }
            .category-content h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="container navbar">
        <a href="index.html" class="logo-container">
            <img src="CG_logo w bg_vertica_green.png" alt="Cat Gaze Logo" class="logo-img">
            <span class="logo-text">Cat Gaze</span>
        </a>
        <nav class="nav-links">
            <a href="index.html">首頁</a>
            <a href="new-arrivals.html">嚴選新品</a>
            <a href="categories.html" class="active-nav" style="color: #7F916A; font-weight: 700;">各類品項</a>
            <a href="tools.html">資材用具</a>
            <a href="knowledge.html">知識中心</a>
            <a href="about.html">關於我們</a>
            <a href="contact.html">聯繫我們</a>
            <a href="member.html">👤 會員</a>
            <a href="javascript:void(0)" onclick="toggleCart()" style="position: relative;">
                🛒 購物車 <span id="cart-count">0</span>
            </a>
        </nav>
    </div>
</header>

<div class="container">
    <div class="category-grid">
        <a href="pet-friendly.html" class="category-card cat-conifer">
            <div class="category-content">
                <h2>寵物友善類</h2>
                <p>Pet-Friendly</p>
            </div>
        </a>

        <a href="products-deciduous.html" class="category-card cat-deciduous">
            <div class="category-content">
                <h2>辦公室療癒類</h2>
                <p>Arboreal species</p>
            </div>
        </a>

        <a href="products-mini.html" class="category-card cat-mini">
            <div class="category-content">
                <h2>風水招財、桃花類</h2>
                <p>Foliage Plants</p>
            </div>
        </a>

        <a href="products-caudex.html" class="category-card cat-pots">
            <div class="category-content">
                <h2>綠手指入門</h2>
                <p>Caudex plants & Succulents</p>
            </div>
        </a>
    </div>
</div>

<footer>
    <div class="container"><p>© 2026 Cat Gaze | 透過貓眼凝視，發掘植栽的靈魂</p></div>
</footer>


<div id="cart-overlay" onclick="toggleCart()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;"></div>

<div id="cart-drawer" style="position:fixed; top:0; right:-400px; width:350px; max-width:90vw; height:100%; background:white; z-index:1000; transition:0.4s; padding:20px; box-shadow:-5px 0 15px rgba(0,0,0,0.1); display:flex; flex-direction:column; box-sizing:border-box;">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #7F916A; padding-bottom:10px;">
        <h3 style="margin:0; color:#7F916A;">您的選植清單</h3>
        <button onclick="toggleCart()" style="border:none; background:none; font-size:20px; cursor:pointer;">✕</button>
    </div>

    <div id="cart-items-content" style="flex-grow:1; overflow-y:auto; padding:20px 0;">
        <p style="text-align:center; color:#999;">目前沒有選購植物</p>
    </div>

    <div style="border-top:1px solid #eee; padding-top:20px;">
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.2rem; margin-bottom:20px;">
            <span>總計金額</span>
            <span id="cart-total-price" style="color:#d14900;">NT$ 0</span>
        </div>
        <button onclick="checkoutToLine()" style="width:100%; background:#7F916A; color:white; border:none; padding:15px; border-radius:30px; font-weight:bold; cursor:pointer;">
            帶它們回家 (聯繫 LINE 結帳)
        </button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="cart-system.js"></script>

</body>
</html>
