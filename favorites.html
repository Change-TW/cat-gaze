<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 | Cat Gaze</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-main: #7F916A;
            --bg-light: #fcfcf8;
            --text-dark: #4a4a4a;
        }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-light); margin: 0; color: var(--text-dark); }
        .container { width: 90%; max-width: 1000px; margin: 0 auto; padding-bottom: 5rem; }
        
        /* --- 全站統一 Header 導覽列 --- */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #eeeeee;
            padding: 0.8rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 55px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 10px;
        }
        .logo-img, .site-logo {
            height: 42px;
            width: auto;
            border-radius: 50%;
            margin-right: 4px;
        }
        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #7F916A;
            letter-spacing: 1px;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            white-space: nowrap;
            margin: 0;
        }
        .nav-links a:hover, .nav-links a.active-nav {
            color: #7F916A;
            font-weight: 700;
        }
        #cart-count {
            background: #d14900;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            position: absolute;
            top: -10px;
            right: -15px;
            font-weight: bold;
            line-height: 1.2;
        }
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                height: auto;
                padding: 10px 0;
                gap: 12px;
            }
            .nav-links {
                justify-content: center;
                gap: 12px;
                width: 100%;
            }
            .nav-links a {
                font-size: 0.88rem;
            }
        }

        .page-title { margin: 3rem 0 2rem; text-align: center; }
        .page-title h1 { font-size: 1.8rem; color: var(--brand-main); font-weight: 500; }
        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .fav-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            position: relative;
        }
        .fav-card:hover { transform: translateY(-5px); }
        .fav-img { width: 100%; height: 250px; object-fit: cover; }
        .fav-info { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .fav-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 5px; }
        .fav-price { color: #d14900; font-weight: 500; }
        .btn-remove {
            position: absolute; top: 10px; right: 10px;
            background: rgba(255,255,255,0.9); border: none;
            width: 35px; height: 35px; border-radius: 50%;
            cursor: pointer; color: #ff4d4d; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
        }
        .empty-state { text-align: center; padding: 5rem 0; color: #aaa; }
        .btn-shop { 
            display: inline-block; margin-top: 20px; padding: 10px 25px; 
            background: var(--brand-main); color: white; text-decoration: none; border-radius: 25px;
        }
    </style>
</head>
<body>

<header>
    <div class="container navbar">
        <a href="index.html" class="logo-container">
            <img src="CG_logo w bg_vertica_green.png" alt="Cat Gaze Logo" class="logo-img">
            <span class="logo-text">Cat Gaze</span>
        </a>
        <nav class="nav-links">
            <a href="index.html">首頁</a>
            <a href="new-arrivals.html">嚴選新品</a>
            <a href="categories.html">各類品項</a>
            <a href="tools.html">資材用具</a>
            <a href="knowledge.html">知識中心</a>
            <a href="about.html">關於我們</a>
            <a href="contact.html">聯繫我們</a>
            <a href="member.html" class="active-nav" style="color: #7F916A; font-weight: 700;">👤 會員</a>
            <a href="javascript:void(0)" onclick="toggleCart()" style="position: relative;">
                🛒 購物車 <span id="cart-count">0</span>
            </a>
        </nav>
    </div>
</header>

<div class="container">
    <div style="margin-top: 20px;">
        <a href="member.html" style="text-decoration:none; color:var(--brand-main); font-weight:500; font-size: 0.9rem;">← 返回會員中心</a>
    </div>
    <div class="page-title">
        <h1>我的收藏</h1>
        <p>凝視過的美好植物</p>
    </div>

    <div id="favorites-list" class="favorites-grid">
        <p style="text-align:center; grid-column: 1/-1;">讀取收藏中...</p>
    </div>
</div>


<div id="cart-overlay" onclick="toggleCart()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;"></div>

<div id="cart-drawer" style="position:fixed; top:0; right:-400px; width:350px; max-width:90vw; height:100%; background:white; z-index:1000; transition:0.4s; padding:20px; box-shadow:-5px 0 15px rgba(0,0,0,0.1); display:flex; flex-direction:column; box-sizing:border-box;">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #7F916A; padding-bottom:10px;">
        <h3 style="margin:0; color:#7F916A;">您的選植清單</h3>
        <button onclick="toggleCart()" style="border:none; background:none; font-size:20px; cursor:pointer;">✕</button>
    </div>

    <div id="cart-items-content" style="flex-grow:1; overflow-y:auto; padding:20px 0;">
        <p style="text-align:center; color:#999;">目前沒有選購植物</p>
    </div>

    <div style="border-top:1px solid #eee; padding-top:20px;">
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.2rem; margin-bottom:20px;">
            <span>總計金額</span>
            <span id="cart-total-price" style="color:#d14900;">NT$ 0</span>
        </div>
        <button onclick="checkoutToLine()" style="width:100%; background:#7F916A; color:white; border:none; padding:15px; border-radius:30px; font-weight:bold; cursor:pointer;">
            帶它們回家 (聯繫 LINE 結帳)
        </button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="cart-system.js"></script>


<script>
    const auth = firebase.auth();

    auth.onAuthStateChanged((user) => {
        if (user) {
            fetchFavorites(user.uid);
        } else {
            window.location.href = "member.html";
        }
    });

    function fetchFavorites(uid) {
        const listContainer = document.getElementById('favorites-list');

        firebase.database().ref('favorites/' + uid).on('value', (snapshot) => {
            listContainer.innerHTML = "";
            const data = snapshot.val();

            if (data) {
                Object.keys(data).forEach(key => {
                    const item = data[key];
                    renderFavCard(key, item);
                });
            } else {
                listContainer.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <p>目前還沒有收藏任何植物</p>
                        <a href="index.html" class="btn-shop">去逛逛</a>
                    </div>`;
            }
        });
    }

    function renderFavCard(key, item) {
        const listContainer = document.getElementById('favorites-list');
        const imgUrl = item.image || 'CG_logo w bg_vertica_green.png';
        const priceVal = Number(item.price) || 0;
        const cardHTML = `
            <div class="fav-card">
                <button class="btn-remove" onclick="removeFavorite('${key}')">×</button>
                <img src="${imgUrl}" class="fav-img" alt="${item.name}">
                <div class="fav-info">
                    <div>
                        <div class="fav-name">${item.name}</div>
                        <div class="fav-price">NT$ ${priceVal.toLocaleString()}</div>
                    </div>
                    <button onclick="addToCart('${item.name}', ${priceVal}, '${imgUrl}')" style="background:#7F916A; color:white; border:none; padding:8px 14px; border-radius:20px; cursor:pointer; font-size:0.85rem; font-weight:bold;">加入購物車</button>
                </div>
            </div>
        `;
        listContainer.insertAdjacentHTML('beforeend', cardHTML);
    }

    function removeFavorite(itemKey) {
        const uid = auth.currentUser.uid;
        if(confirm("確定要取消收藏嗎？")) {
            firebase.database().ref('favorites/' + uid + '/' + itemKey).remove();
        }
    }
</script>
</body>
</html>
