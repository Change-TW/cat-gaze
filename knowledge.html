    let allArticles = [];

    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function getCellValue(cell) {
        if (!cell) return '';
        if (cell.f !== undefined && cell.f !== null && String(cell.f).trim() !== '') {
            return String(cell.f).trim();
        }
        if (cell.v === undefined || cell.v === null) return '';
        // 處理 GViz Date(YYYY,M,D) 格式
        const raw = String(cell.v).trim();
        const dateMatch = raw.match(/^Date\((\d+),(\d+),(\d+)\)$/);
        if (dateMatch) {
            const y = dateMatch[1];
            const m = String(Number(dateMatch[2]) + 1).padStart(2, '0');
            const d = String(Number(dateMatch[3])).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        return raw;
    }

    function formatDisplayDate(dateStr) {
        if (!dateStr) return '';
        return dateStr.replace(/-/g, '.').replace(/\//g, '.');
    }

    function parseSortableDate(dateStr) {
        if (!dateStr) return 0;
        const normalized = dateStr.replace(/\./g, '-').replace(/\//g, '-');
        const ts = Date.parse(normalized);
        return isNaN(ts) ? 0 : ts;
    }

    function renderArticles(articles) {
        const grid = document.getElementById('article-grid');
        if (!articles || articles.length === 0) {
            grid.innerHTML = '<div class="empty-state">目前此分類尚無已發佈文章，敬請期待。</div>';
            return;
        }

        // 排序：置頂精選優先，其餘依發佈日期由新到舊排序
        const sorted = [...articles].sort((a, b) => {
            const featA = a.featured === '是' ? 1 : 0;
            const featB = b.featured === '是' ? 1 : 0;
            if (featA !== featB) return featB - featA;
            return parseSortableDate(b.date) - parseSortableDate(a.date);
        });

        grid.innerHTML = sorted.map(article => {
            const isFeatured = article.featured === '是';
            const cardClass = isFeatured ? 'article-card featured-post' : 'article-card';
            const imgSrc = escapeHtml(article.image || 'pine-select.jpg');
            const imgAlt = escapeHtml(article.alt || article.title);
            const displayDate = escapeHtml(formatDisplayDate(article.date));
            const category = escapeHtml(article.category || '未分類');
            const title = escapeHtml(article.title);
            const excerpt = escapeHtml(article.excerpt);
            const pageUrl = escapeHtml(article.page_url || '#');

            return `
                <div class="${cardClass}" data-category="${category}">
                    <div class="article-image">
                        <img src="${imgSrc}" alt="${imgAlt}" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='pine-select.jpg'">
                    </div>
                    <div class="article-content">
                        <div class="article-meta">${displayDate} | ${category}</div>
                        <div class="article-title">${title}</div>
                        <div class="article-excerpt">${excerpt}</div>
                        <a href="${pageUrl}" class="read-more">繼續閱讀 →</a>
                    </div>
                </div>
            `;
        }).join('');

        applyCategoryFilter(currentCategory);
    }

    function applyCategoryFilter(category) {
        const cards = document.querySelectorAll('#article-grid .article-card');
        let visibleCount = 0;

        cards.forEach(card => {
            const cardCategory = card.getAttribute('data-category');
            const titleText = card.querySelector('.article-title')?.innerText || '';
            const match = (
                category === '全部文章' ||
                cardCategory === category ||
                (category === '養護基礎' && titleText.includes('萬用土'))
            );

            if (match) {
                card.style.display = card.classList.contains('featured-post') ? 'grid' : 'block';
                card.style.opacity = '0';
                setTimeout(() => { card.style.opacity = '1'; }, 10);
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        const existingEmpty = document.querySelector('#article-grid .empty-state');
        if (existingEmpty) existingEmpty.remove();

        if (visibleCount === 0 && cards.length > 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'empty-state';
            emptyDiv.textContent = `「${category}」目前尚無文章，歡迎瀏覽其他分類。`;
            document.getElementById('article-grid').appendChild(emptyDiv);
        }
    }

    function filterArticles(category, btn) {
        currentCategory = category;
        document.querySelectorAll('.filter-btn').forEach(button => {
            button.classList.remove('active');
        });
        if (btn) btn.classList.add('active');
        applyCategoryFilter(category);
    }

    async function loadArticlesFromSheet() {
        try {
            const response = await fetch(GVIZ_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const text = await response.text();

            // 解析 Google Visualization 回傳的 JSONP 包裝
            const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\((.*)\);?$/s);
            if (!jsonMatch) throw new Error('無法解析試算表資料格式');
            const data = JSON.parse(jsonMatch[1]);
            const rows = data?.table?.rows || [];

            const parsed = rows.map(row => {
                const c = row.c || [];
                return {
                    id: getCellValue(c[0]),
                    status: getCellValue(c[1]),
                    featured: getCellValue(c[2]),
                    category: getCellValue(c[3]),
                    title: getCellValue(c[4]),
                    date: getCellValue(c[5]),
                    excerpt: getCellValue(c[6]),
                    image: getCellValue(c[7]),
                    alt: getCellValue(c[8]),
                    page_url: getCellValue(c[9]),
                    notes: getCellValue(c[10])
                };
            }).filter(item => {
                // 僅顯示「上架」且有標題的文章（自動排除標題列、草稿與下架）
                const st = item.status;
                return item.title && st.includes('上架') && !st.includes('不上架') && !st.includes('草稿') && !st.includes('下架');
            });

            if (parsed.length > 0) {
                allArticles = parsed;
                renderArticles(allArticles);
            } else {
                throw new Error('試算表無符合上架條件的文章');
            }
        } catch (err) {
            console.warn('讀取雲端中控表失敗，切換為內建備援清單：', err);
            allArticles = FALLBACK_ARTICLES;
            renderArticles(allArticles);
        }
    }

    function handleSubscribe(event) {
        event.preventDefault();
        const emailInput = document.getElementById('subscriber-email');
        const email = emailInput.value;
        const msg = document.getElementById('subscribe-msg');
        msg.innerText = "感謝訂閱！養護週報將寄送至：" + email;
        msg.style.display = "block";
        msg.style.color = "#FDFAD9";
        emailInput.value = "";
    }

    document.addEventListener('DOMContentLoaded', loadArticlesFromSheet);
</script>
</body>
</html>
