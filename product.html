<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-title">產品詳情 | Cat Gaze</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-main: #7F916A;
            --brand-accent: #B0C4B8;
            --brand-cream: #FDFAD9;
            --bg-light: #fcfcf8;
            --text-dark: #4a4a4a;
            --price-color: #d14900;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.75;
        }
        .container { width: 90%; max-width: 1180px; margin: 0 auto; }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #eeeeee;
            padding: 0.8rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 55px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 10px;
        }
        .logo-img {
            height: 42px;
            width: auto;
            border-radius: 50%;
            margin-right: 4px;
        }
        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #7F916A;
            letter-spacing: 1px;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            white-space: nowrap;
        }
        .nav-links a:hover, .nav-links a.active-nav {
            color: #7F916A;
            font-weight: 700;
        }
        #cart-count {
            background: #d14900;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            position: absolute;
            top: -10px;
            right: -15px;
            font-weight: bold;
            line-height: 1.2;
        }

        .back-link { color: #888; text-decoration: none; font-size: 0.9rem; margin-top: 25px; display: inline-block; transition: 0.2s; }
        .back-link:hover { color: var(--brand-main); }
        .product-detail-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 60px; padding: 2.5rem 0; }
        .image-gallery img { width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .info-section h1 { font-size: 2.2rem; color: var(--brand-main); margin: 0 0 10px 0; font-weight: 500; }
        .product-id { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; letter-spacing: 1px; }
        .price { font-size: 2.5rem; color: var(--price-color); font-weight: bold; margin-bottom: 20px; }
        .btn-buy {
            display: block; width: 100%; background-color: var(--brand-main); color: white;
            padding: 16px; text-align: center; border: none; border-radius: 30px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px;
        }
        .btn-buy:hover { background-color: #5d7065; transform: translateY(-2px); }
        .btn-fav {
            display: block; width: 100%; background-color: white; color: var(--brand-main);
            padding: 12px; text-align: center; border: 1.5px solid var(--brand-main); border-radius: 30px;
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px;
        }
        .btn-fav:hover { background-color: #f0f3ed; }
        .gaze-files { margin-top: 35px; background: white; padding: 25px; border-radius: 12px; border: 1px solid #eee; }
        .gaze-files h3 { color: var(--brand-main); margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid var(--brand-accent); padding-bottom: 10px; }
        .gaze-list div { display: flex; justify-content: space-between; gap: 15px; padding: 10px 0; border-bottom: 1px dashed #f0f0f0; font-size: 0.95rem; }
        .gaze-list span:first-child { color: #888; flex-shrink: 0; }
        .gaze-list span:last-child { text-align: right; }
        .content-section { padding: 3rem 0; border-top: 1px solid #eee; }
        .section-heading { font-size: 1.6rem; color: var(--brand-main); margin-bottom: 25px; position: relative; }
        .section-heading::after { content: ''; display: block; width: 50px; height: 3px; background: var(--brand-accent); margin-top: 8px; }
        .care-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .care-item { display: flex; gap: 15px; }
        .care-icon { font-size: 1.8rem; }
        .care-text h4 { margin: 0; color: var(--brand-main); }
        .care-text p { margin: 5px 0 0 0; font-size: 0.9rem; color: #666; }

        .pet-container { display: flex; gap: 50px; padding: 50px 0; flex-wrap: wrap; }
        .pet-img-col { flex: 1.2; min-width: 320px; }
        .pet-img-col img { width: 100%; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); }
        .pet-info-col { flex: 1; min-width: 320px; }
        .care-tags { display: flex; gap: 15px; margin: 25px 0; }
        .care-tag { background: white; border: 1px solid #eee; padding: 10px 18px; border-radius: 12px; text-align: center; flex: 1; }
        .care-tag span { display: block; font-size: 0.75rem; color: #999; }
        .care-tag strong { display: block; font-size: 0.95rem; color: var(--brand-main); }
        .qiaoyu-box {
            background: var(--brand-cream); padding: 25px; border-radius: 20px;
            position: relative; margin: 35px 0; border-left: 5px solid var(--brand-main);
        }
        .qiaoyu-title { font-weight: 700; color: var(--brand-main); margin-bottom: 8px; display: block; }
        .qiaoyu-text { font-size: 0.95rem; font-style: italic; margin: 0; }

        footer { background-color: var(--brand-main); color: white; text-align: center; padding: 3rem 0; margin-top: 4rem; }
        @media (max-width: 768px) {
            .navbar { flex-direction: column; height: auto; padding: 10px 0; gap: 12px; }
            .nav-links { justify-content: center; gap: 12px; width: 100%; }
            .product-detail-grid, .care-grid { grid-template-columns: 1fr !important; gap: 30px; }
            .care-tags { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <div class="container navbar">
        <a href="index.html" class="logo-container">
            <img src="CG_logo w bg_vertica_green.png" alt="Cat Gaze Logo" class="logo-img">
            <span class="logo-text">Cat Gaze</span>
        </a>
        <nav class="nav-links">
            <a href="index.html">首頁</a>
            <a href="new-arrivals.html">嚴選新品</a>
            <a href="categories.html">各類品項</a>
            <a href="tools.html">資材用具</a>
            <a href="knowledge.html">知識中心</a>
            <a href="about.html">關於我們</a>
            <a href="contact.html">聯繫我們</a>
            <a href="member.html">👤 會員</a>
            <a href="javascript:void(0)" onclick="toggleCart()" style="position: relative;">
                🛒 購物車 <span id="cart-count">0</span>
            </a>
        </nav>
    </div>
</header>

<div id="dynamic-product-mount" class="container">
    <div style="text-align:center; padding: 80px 20px; color:#888;">
        正在從雲端載入商品詳情...
    </div>
</div>

<footer>
    <div class="container"><p>© 2026 Cat Gaze | 透過貓眼凝視，發掘植栽的靈魂</p></div>
</footer>

<div id="cart-overlay" onclick="toggleCart()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;"></div>
<div id="cart-drawer" style="position:fixed; top:0; right:-400px; width:350px; max-width:90vw; height:100%; background:white; z-index:1000; transition:0.4s; padding:20px; box-shadow:-5px 0 15px rgba(0,0,0,0.1); display:flex; flex-direction:column; box-sizing:border-box;">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #7F916A; padding-bottom:10px;">
        <h3 style="margin:0; color:#7F916A;">您的選植清單</h3>
        <button onclick="toggleCart()" style="border:none; background:none; font-size:20px; cursor:pointer;">✕</button>
    </div>
    <div id="cart-items-content" style="flex-grow:1; overflow-y:auto; padding:20px 0;">
        <p style="text-align:center; color:#999;">目前沒有選購植物</p>
    </div>
    <div style="border-top:1px solid #eee; padding-top:20px;">
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.2rem; margin-bottom:20px;">
            <span>總計金額</span>
            <span id="cart-total-price" style="color:#d14900;">NT$ 0</span>
        </div>
        <button onclick="checkoutToLine()" style="width:100%; background:#7F916A; color:white; border:none; padding:15px; border-radius:30px; font-weight:bold; cursor:pointer;">
            帶它們回家 (聯繫 LINE 結帳)
        </button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="cart-system.js"></script>

<script>
    function drawProductToDOM(p) {
        const mount = document.getElementById('dynamic-product-mount');

        // 若狀態為「下架」，顯示已下架提示並關閉購買按鈕
        if (p.status === '下架') {
            mount.innerHTML = `
            <div style="text-align:center; padding:80px 20px;">
                <h2 style="color:var(--brand-main);">此商品「${p.title}」目前已下架或售罄</h2>
                <p style="color:#888; margin-bottom:25px;">感謝您的凝視，歡迎前往其他專區挑選合眼緣的植栽與職人資材。</p>
                <a href="categories.html" style="background:var(--brand-main); color:white; padding:12px 28px; border-radius:25px; text-decoration:none; font-weight:bold;">← 瀏覽其他嚴選商品</a>
            </div>`;
            return;
        }

        document.title = p.title + " | Cat Gaze";
        const priceNum = Number(p.price) || 0;
        const safeTitle = (p.title || '').replace(/'/g, "\\'");
        const safeImg = (p.image || '').replace(/'/g, "\\'");

        if (p.template === 'pet') {
            const pet = p.petDetails || {};
            mount.innerHTML = `
            <div class="pet-container">
                <section class="pet-img-col">
                    <img src="${p.image}" alt="${p.title}" onerror="this.src='CG_logo w bg_vertica_green.png'">
                    <div style="margin-top: 20px; color: #888; font-size: 0.9rem; text-align: center;">
                        * 植株均包含手工陶盆與天然赤玉土介質
                    </div>
                </section>
                <section class="pet-info-col">
                    <div style="font-size:0.85rem; color:#aaa; margin-bottom:10px;">
                        <a href="index.html" style="color:#888; text-decoration:none;">首頁</a> /
                        <a href="pet-friendly.html" style="color:#888; text-decoration:none;">嚴選植栽</a> / ${p.title}
                    </div>
                    <h1 style="font-size:2.2rem; margin:0 0 15px; color:var(--text-dark);">${p.title}</h1>
                    <div style="font-size:1.8rem; font-weight:700; color:var(--price-color); margin-bottom:25px;">NT$ ${priceNum.toLocaleString()}</div>
                    <p>${pet.desc || ''}</p>
                    <div class="care-tags">
                        <div class="care-tag"><span>光照要求</span><strong>${pet.light || '半日照 / 通風'}</strong></div>
                        <div class="care-tag"><span>澆水頻率</span><strong>${pet.water || '土乾澆透'}</strong></div>
                        <div class="care-tag"><span>規格 / 安全評級</span><strong>${pet.safe || '100% 寵物無害'}</strong></div>
                    </div>
                    <div class="qiaoyu-box">
                        <span class="qiaoyu-title">🐈 店長「巧遇」的悄悄話：</span>
                        <p class="qiaoyu-text">${pet.qiaoyu || '「這盆本喵親自鑑定過，安全無毒又好照顧喵～」'}</p>
                    </div>
                    <div style="display:flex; gap:15px; margin-top:30px;">
                        <button class="btn-buy" style="flex:2; margin:0;" onclick="addToCart('${safeTitle}', ${priceNum}, '${safeImg}')">加入購物清單</button>
                        <button class="btn-fav" style="flex:1; margin:0;" onclick="addToFavorites('${safeTitle}', ${priceNum}, '${safeImg}')">收藏植物</button>
                    </div>
                </section>
            </div>
            `;
        } else if (p.template === 'tool') {
            const f = p.files || {};
            mount.innerHTML = `
            <a href="tools.html" class="back-link">← 返回資材用具專區</a>
            <div class="product-detail-grid">
                <div class="image-gallery">
                    <img src="${p.image}" alt="${p.title}" onerror="this.src='CG_logo w bg_vertica_green.png'">
                    <div style="margin-top: 15px; color: #888; font-size: 0.9rem;">✦ Cat Gaze 職人嚴選資材・品質保證</div>
                </div>
                <div class="info-section">
                    <h1>${p.title}</h1>
                    <p class="product-id">編號: ${p.id} | ${p.badge || '職人選物'}</p>
                    <div class="price">NT$ ${priceNum.toLocaleString()}</div>
                    <div style="color: var(--text-dark); font-weight: 500; margin-bottom: 24px; line-height: 1.8;">
                        ${p.tagline || '✦ 工欲善其事，必先利其器。Cat Gaze 嚴選專業盆景養護資材。'}
                    </div>
                    <button class="btn-buy" onclick="addToCart('${safeTitle}', ${priceNum}, '${safeImg}')">✦ 加入選植清單</button>
                    <button class="btn-fav" onclick="addToFavorites('${safeTitle}', ${priceNum}, '${safeImg}')">♡ 加入我的收藏</button>
                    <p style="text-align: center; font-size: 0.8rem; color: #999;">預計 2-3 個工作天內妥善包裝出貨 (不含例假日)</p>
                    <div class="gaze-files">
                        <h3>【Cat Gaze 職人資材規格檔案】</h3>
                        <div class="gaze-list">
                            <div><span>✦ 品項類別</span><span>${f.species || '--'}</span></div>
                            <div><span>✦ 材質／產地</span><span>${f.age || '--'}</span></div>
                            <div><span>✦ 尺寸／容量</span><span>${f.size || '--'}</span></div>
                            <div><span>✦ 適用與保養</span><span>${f.pot || '--'}</span></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="content-section">
                <h2 class="section-heading">職人資材使用與保養指南</h2>
                <div class="care-grid">
                    <div class="care-item"><div class="care-icon">✂️</div><div class="care-text"><h4>修剪工具保養</h4><p>每次修剪完畢後，請以乾布擦拭刀刃上的樹液與水分，並薄塗一層防鏽油或椿油收納。</p></div></div>
                    <div class="care-item"><div class="care-icon">🪨</div><div class="care-text"><h4>顆粒介質使用</h4><p>換盆前建議先以篩網濾除底部細微粉塵，盆底鋪設大顆粒作為排水層，能大幅提升根系透氣度。</p></div></div>
                    <div class="care-item"><div class="care-icon">🏺</div><div class="care-text"><h4>手作陶盆養盆</h4><p>柴燒與粗陶盆具天然微孔隙，隨日常澆水與歲月推移會逐漸養出溫潤古樸的包漿色澤。</p></div></div>
                    <div class="care-item"><div class="care-icon">📖</div><div class="care-text"><h4>進階養護知識</h4><p>想了解赤玉土黃金混土比例或春季摘芽技巧，歡迎隨時造訪「<a href="knowledge.html" style="color:var(--brand-main);">知識中心</a>」閱讀專欄。</p></div></div>
                </div>
            </div>
            `;
        } else {
            const f = p.files || {};
            mount.innerHTML = `
            <a href="javascript:history.back()" class="back-link">← 返回上一頁</a>
            <div class="product-detail-grid">
                <div class="image-gallery">
                    <img src="${p.image}" alt="${p.title}" onerror="this.src='CG_logo w bg_vertica_green.png'">
                    <div style="margin-top: 15px; color: #888; font-size: 0.9rem;">✦ 實際拍攝，僅此一盆</div>
                </div>
                <div class="info-section">
                    <h1>${p.title}</h1>
                    <p class="product-id">編號: ${p.id}</p>
                    <div class="price">NT$ ${priceNum.toLocaleString()}</div>
                    <div style="color: var(--brand-main); font-weight: 600; margin-bottom: 20px;">
                        ${p.tagline || '✦ 貓眼嚴選'}
                    </div>
                    <button class="btn-buy" onclick="addToCart('${safeTitle}', ${priceNum}, '${safeImg}')">✦ 加入購物車</button>
                    <button class="btn-fav" onclick="addToFavorites('${safeTitle}', ${priceNum}, '${safeImg}')">♡ 加入我的收藏</button>
                    <p style="text-align: center; font-size: 0.8rem; color: #999;">預計 2-3 個工作天內出貨 (不含例假日)</p>
                    <div class="gaze-files">
                        <h3>【Cat Gaze 嚴選檔案】</h3>
                        <div class="gaze-list">
                            <div><span>✦ 樹種</span><span>${f.species || '--'}</span></div>
                            <div><span>✦ 樹齡</span><span>${f.age || '--'}</span></div>
                            <div><span>✦ 尺寸</span><span>${f.size || '--'}</span></div>
                            <div><span>✦ 盆器</span><span>${f.pot || '--'}</span></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="content-section">
                <h2 class="section-heading">日常養護指南</h2>
                <div class="care-grid">
                    <div class="care-item"><div class="care-icon">☀️</div><div class="care-text"><h4>日照需求</h4><p>喜全日照或半日照環境，擺放於通風良好的陽台或窗台最佳。</p></div></div>
                    <div class="care-item"><div class="care-icon">💧</div><div class="care-text"><h4>澆水原則</h4><p>「乾透澆透」，觀察表土變淺微乾時全盆澆透至盆底出水。</p></div></div>
                    <div class="care-item"><div class="care-icon">🌬️</div><div class="care-text"><h4>通風環境</h4><p>保持空氣流通，良好的微風能強健枝葉並預防悶根。</p></div></div>
                    <div class="care-item"><div class="care-icon">✂️</div><div class="care-text"><h4>修剪摘芽</h4><p>生長期適度摘除徒長頂芽，維持緊密優雅的樹冠輪廓。</p></div></div>
                </div>
            </div>
            `;
        }
    }

    function renderProductDetail() {
        const params = new URLSearchParams(window.location.search);
        const prodId = params.get('id');
        const mount = document.getElementById('dynamic-product-mount');

        if (!prodId) {
            mount.innerHTML = `<div style="text-align:center; padding:80px 20px;"><h3>找不到指定的商品</h3><a href="categories.html" style="color:#7F916A; font-weight:bold;">← 返回各類品項總覽</a></div>`;
            return;
        }

        if (window.__CATGAZE_SHEET_PRODUCTS__ && window.__CATGAZE_SHEET_PRODUCTS__[prodId]) {
            drawProductToDOM(window.__CATGAZE_SHEET_PRODUCTS__[prodId]);
            return;
        }

        window.__onSheetProductsReady = function(sheetMap) {
            if (sheetMap && sheetMap[prodId]) {
                drawProductToDOM(sheetMap[prodId]);
            }
        };

        firebase.database().ref('products/' + prodId).once('value').then((snap) => {
            const p = snap.val();
            if (p) {
                drawProductToDOM(p);
            } else {
                setTimeout(() => {
                    if (window.__CATGAZE_SHEET_PRODUCTS__ && window.__CATGAZE_SHEET_PRODUCTS__[prodId]) {
                        drawProductToDOM(window.__CATGAZE_SHEET_PRODUCTS__[prodId]);
                    } else {
                        mount.innerHTML = `<div style="text-align:center; padding:80px 20px;"><h3>此商品尚未上架或已售出 (${prodId})</h3><a href="categories.html" style="color:#7F916A; font-weight:bold;">← 返回各類品項總覽</a></div>`;
                    }
                }, 1200);
            }
        });
    }

    window.addEventListener('DOMContentLoaded', renderProductDetail);
</script>
</body>
</html>
