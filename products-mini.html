<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風水招財、桃花類 | Cat Gaze</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-main: #7F916A;
            --brand-accent: #B0C4B8;
            --brand-cream: #FDFAD9;
            --bg-light: #fcfcf8;
            --text-dark: #4a4a4a;
            --price-color: #d14900;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-light);
            margin: 0; color: var(--text-dark);
            line-height: 1.6;
        }
        .container { width: 92%; max-width: 1300px; margin: 0 auto; }
        
        /* --- 全站統一 Header 導覽列 --- */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #eeeeee;
            padding: 0.8rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 55px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 10px;
        }
        .logo-img, .site-logo {
            height: 42px;
            width: auto;
            border-radius: 50%;
            margin-right: 4px;
        }
        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #7F916A;
            letter-spacing: 1px;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            white-space: nowrap;
            margin: 0;
        }
        .nav-links a:hover, .nav-links a.active-nav {
            color: #7F916A;
            font-weight: 700;
        }
        #cart-count {
            background: #d14900;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            position: absolute;
            top: -10px;
            right: -15px;
            font-weight: bold;
            line-height: 1.2;
        }
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                height: auto;
                padding: 10px 0;
                gap: 12px;
            }
            .nav-links {
                justify-content: center;
                gap: 12px;
                width: 100%;
            }
            .nav-links a {
                font-size: 0.88rem;
            }
        }

        .foliage-hero {
            padding: 90px 0;
            background: linear-gradient(135deg, #fdfad9 0%, #e8ede3 100%);
            position: relative;
            text-align: center;
            overflow: hidden;
            border-bottom: 1px solid #eef2eb;
        }
        .hero-decor {
            position: absolute; font-size: 18rem; opacity: 0.05;
            bottom: -50px; right: 5%; transform: rotate(-15deg);
            pointer-events: none;
        }
        .foliage-hero h1 { font-size: 3rem; margin: 0; font-weight: 400; letter-spacing: 6px; color: var(--brand-main); }
        .foliage-hero p { font-size: 1.1rem; opacity: 0.8; margin-top: 15px; }
        .quick-filter { display: flex; justify-content: center; gap: 16px; padding: 40px 0; flex-wrap: wrap; }
        .filter-btn {
            background: white; border: 1px solid #ddd; padding: 8px 24px;
            border-radius: 50px; cursor: pointer; color: #666; transition: 0.3s; font-size: 0.95rem;
        }
        .filter-btn.active, .filter-btn:hover { background: var(--brand-main); color: white; border-color: var(--brand-main); }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 50px 30px;
            padding-bottom: 100px;
        }
        .product-card { background: transparent; position: relative; transition: 0.4s ease; }
        .img-container {
            position: relative; border-radius: 12px; overflow: hidden;
            background: white; box-shadow: 0 10px 30px rgba(127, 145, 106, 0.08);
        }
        .product-card::before {
            content: ""; position: absolute; top: -10px; left: -10px; width: 40px; height: 40px;
            background: var(--brand-cream); z-index: -1; transition: 0.4s; opacity: 0;
        }
        .product-card:hover::before { opacity: 1; transform: translate(5px, 5px); }
        .img-box { height: 360px; width: 100%; position: relative; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
        .product-card:hover .img-box img { transform: scale(1.05); }
        .env-label {
            position: absolute; top: 15px; right: 15px; z-index: 2;
            background: rgba(255,255,255,0.92); padding: 4px 12px;
            border-radius: 4px; font-size: 0.75rem; color: var(--brand-main);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-weight: 500;
        }
        .product-info { padding: 22px 0 0; text-align: center; }
        .product-info h3 { margin: 0; font-size: 1.3rem; font-weight: 600; color: #333; }
        .product-desc { font-size: 0.88rem; color: #888; margin: 8px 0 15px; min-height: 42px; }
        .price-row { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .price { font-size: 1.3rem; font-weight: 700; color: var(--price-color); }
        .btn-add {
            background: white; border: 1.5px solid var(--brand-main); color: var(--brand-main);
            padding: 8px 30px; border-radius: 50px; cursor: pointer;
            font-size: 0.9rem; font-weight: 600; transition: 0.3s;
        }
        .btn-add:hover { background: var(--brand-main); color: white; }
        .reveal { opacity: 0; transform: translateY(20px); transition: 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        footer { background-color: var(--brand-main); color: white; text-align: center; padding: 3.5rem 0; margin-top: 2rem; }
    </style>
</head>
<body>

<header>
    <div class="container navbar">
        <a href="index.html" class="logo-container">
            <img src="CG_logo w bg_vertica_green.png" alt="Cat Gaze Logo" class="logo-img">
            <span class="logo-text">Cat Gaze</span>
        </a>
        <nav class="nav-links">
            <a href="index.html">首頁</a>
            <a href="new-arrivals.html">嚴選新品</a>
            <a href="categories.html" class="active-nav" style="color: #7F916A; font-weight: 700;">各類品項</a>
            <a href="tools.html">資材用具</a>
            <a href="knowledge.html">知識中心</a>
            <a href="about.html">關於我們</a>
            <a href="contact.html">聯繫我們</a>
            <a href="member.html">👤 會員</a>
            <a href="javascript:void(0)" onclick="toggleCart()" style="position: relative;">
                🛒 購物車 <span id="cart-count">0</span>
            </a>
        </nav>
    </div>
</header>

<section class="foliage-hero">
    <div class="hero-decor">🌿</div>
    <div class="container">
        <h1>風水招財、桃花類</h1>
        <p>呼吸，在每一片翠綠的脈絡裡</p>
    </div>
</section>

<div class="container">
    <div class="quick-filter">
        <button class="filter-btn active" data-filter="all">全部植物</button>
        <button class="filter-btn" data-filter="大型落地">大型落地</button>
        <button class="filter-btn" data-filter="桌面盆栽">桌面盆栽</button>
        <button class="filter-btn" data-filter="珍稀斑葉">珍稀斑葉</button>
    </div>

    <div class="product-grid">
        <div class="product-card reveal" data-category="珍稀斑葉 大型落地">
            <div class="img-container">
                <div class="env-label">☀️ 散射光</div>
                <div class="img-box">
                    <img src="monstera.jpg" alt="斑葉龜背芋">
                </div>
            </div>
            <div class="product-info">
                <h3>斑葉龜背芋</h3>
                <p class="product-desc">室內植栽的王者，優雅的葉片裂紋與奶油色斑塊。</p>
                <div class="price-row">
                    <span class="price">NT$ 2,800</span>
                    <button class="btn-add" onclick="addToCart('斑葉龜背芋', 2800, 'monstera.jpg')">加入選植清單</button>
                </div>
            </div>
        </div>

        <div class="product-card reveal" data-category="桌面盆栽">
            <div class="img-container">
                <div class="env-label">☁️ 耐陰</div>
                <div class="img-box">
                    <img src="alocasia.jpg" alt="黑葉觀音蓮">
                </div>
            </div>
            <div class="product-info">
                <h3>黑葉觀音蓮</h3>
                <p class="product-desc">深邃的墨綠色葉面，搭配醒目的白色葉脈。</p>
                <div class="price-row">
                    <span class="price">NT$ 980</span>
                    <button class="btn-add" onclick="addToCart('黑葉觀音蓮', 980, 'alocasia.jpg')">加入選植清單</button>
                </div>
            </div>
        </div>

        <div class="product-card reveal" data-category="桌面盆栽">
            <div class="img-container">
                <div class="env-label">💧 喜濕度</div>
                <div class="img-box">
                    <img src="calathea.jpg" alt="圓葉竹芋">
                </div>
            </div>
            <div class="product-info">
                <h3>圓葉竹芋</h3>
                <p class="product-desc">如手繪般的紋路，夜晚葉片會閉合的有趣習性。</p>
                <div class="price-row">
                    <span class="price">NT$ 1,200</span>
                    <button class="btn-add" onclick="addToCart('圓葉竹芋', 1200, 'calathea.jpg')">加入選植清單</button>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    <div class="container"><p>© 2026 Cat Gaze | 透過貓眼凝視，發掘植栽的靈魂</p></div>
</footer>


<div id="cart-overlay" onclick="toggleCart()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;"></div>

<div id="cart-drawer" style="position:fixed; top:0; right:-400px; width:350px; max-width:90vw; height:100%; background:white; z-index:1000; transition:0.4s; padding:20px; box-shadow:-5px 0 15px rgba(0,0,0,0.1); display:flex; flex-direction:column; box-sizing:border-box;">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #7F916A; padding-bottom:10px;">
        <h3 style="margin:0; color:#7F916A;">您的選植清單</h3>
        <button onclick="toggleCart()" style="border:none; background:none; font-size:20px; cursor:pointer;">✕</button>
    </div>

    <div id="cart-items-content" style="flex-grow:1; overflow-y:auto; padding:20px 0;">
        <p style="text-align:center; color:#999;">目前沒有選購植物</p>
    </div>

    <div style="border-top:1px solid #eee; padding-top:20px;">
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.2rem; margin-bottom:20px;">
            <span>總計金額</span>
            <span id="cart-total-price" style="color:#d14900;">NT$ 0</span>
        </div>
        <button onclick="checkoutToLine()" style="width:100%; background:#7F916A; color:white; border:none; padding:15px; border-radius:30px; font-weight:bold; cursor:pointer;">
            帶它們回家 (聯繫 LINE 結帳)
        </button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="cart-system.js"></script>


<script>
    function reveal() {
        var reveals = document.querySelectorAll(".reveal");
        for (var i = 0; i < reveals.length; i++) {
            var windowHeight = window.innerHeight;
            var elementTop = reveals[i].getBoundingClientRect().top;
            var elementVisible = 80;
            if (elementTop < windowHeight - elementVisible) {
                reveals[i].classList.add("active");
            }
        }
    }
    window.addEventListener("scroll", reveal);
    reveal();

    const filterBtns = document.querySelectorAll('.filter-btn');
    const cards = document.querySelectorAll('.product-card');
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filterVal = btn.getAttribute('data-filter');
            cards.forEach(card => {
                const cats = card.getAttribute('data-category') || '';
                if (filterVal === 'all' || cats.includes(filterVal)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    });
</script>
</body>
</html>
